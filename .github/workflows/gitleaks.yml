name: Gitleaks Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-sqlite-db:
    name: Block SQLite DB Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if .db files are tracked
        run: |
          if git ls-files | grep -E "\.db$"; then
            echo "ERROR: SQLite database files (.db) are tracked in git — this is not allowed."
            echo "Remove them with: git rm --cached <file> and add to .gitignore."
            exit 1
          else
            echo "No .db files found in tracked files. ✓"
          fi
